<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unsupported constructs · verihogg reports</title>
  <link rel="stylesheet" href="sv-tests-reports.css">
  <style>
    main {
      --timeline-inset: clamp(8px, 1.6vw, 24px);
      --timeline-item-margin: 6px;
      --timeline-item-indent: 24px;
      padding-bottom: 64px;
      font-size: 19px;
    }
    main a { color: var(--blue); text-underline-offset: .18em; }
    main a:focus-visible, summary:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; }
    .current { margin: 0 0 38px calc(var(--timeline-inset) + var(--timeline-item-margin) + var(--timeline-item-indent)); }
    .timeline { list-style: none; margin: 0 var(--timeline-inset); padding: 0; }
    .timeline > li {
      --marker-y: 14px; position: relative; margin-left: var(--timeline-item-margin);
      padding: 0 0 28px var(--timeline-item-indent);
    }
    .timeline > li::before {
      content: ""; position: absolute; inset: 0 auto 0 0; border-left: 3px solid #939bb1;
    }
    .timeline > li:first-child::before { top: var(--marker-y); }
    .timeline > li:last-child::before { bottom: auto; height: var(--marker-y); }
    .timeline > li:only-child::before { display: none; }
    .timeline > li::after {
      content: ""; position: absolute; box-sizing: border-box; top: calc(var(--marker-y) - 9px);
      left: -7.5px; width: 18px; height: 18px;
      border: 3px solid var(--blue); border-radius: 50%; background: var(--paper);
    }
    .timeline > .no-changes { --marker-y: 34px; padding-block: 20px 46px; }
    .timeline > .no-changes::before { border-left-style: dashed; }
    .timeline > .no-changes::after { border-color: #687590; }
    .timeline h3 { margin: 0; font-size: 21px; line-height: 1.4; overflow-wrap: anywhere; }
    .timeline h3 a, .no-changes li > a:first-child { color: var(--ink); text-decoration: none; }
    .timeline h3 a:hover, .timeline h3 a:focus-visible, .no-changes li > a:first-child:hover { text-decoration: underline; }
    code, time { font: 16px var(--mono); color: #4a5772; white-space: nowrap; }
    time { display: inline-block; margin-left: .4em; }
    .timeline p, details { margin: 6px 0 0; line-height: 1.45; }
    .diagnostic-change { margin: 10px 0 0 20px; font-size: 16px; }
    .diagnostic-change + .diagnostic-change { margin-top: 4px; }
    .no-changes details { margin: 0; }
    summary { width: fit-content; cursor: pointer; color: #4a5772; }
    summary:hover { color: var(--blue); }
    details ul { margin: 7px 0 0; padding-left: 22px; overflow-wrap: anywhere; }
    .no-changes details > ul { margin-top: 14px; }
    details li + li { margin-top: 5px; }
    @media (max-width: 760px) {
      main { --timeline-item-indent: 18px; }
      .current { margin-bottom: 30px; }
      time { display: block; margin: 2px 0 0; }
    }
  </style>
</head>
<body>
  <header class="report-header">
    <p class="report-brand"><a href="index.html">verihogg <span>/ reports</span></a></p>
    <h2>Unsupported constructs</h2>
  </header>
  <main class="history-content">
    <p class="current"><a href="unsupported.html">Current unsupported constructs</a></p>
    <!-- SUPPORT_HISTORY -->
  </main>
</body>
</html>
