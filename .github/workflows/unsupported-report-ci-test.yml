name: unsupported-report-ci-test

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout formatter
        uses: actions/checkout@v6
        with:
          path: formatter

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build formatter and export closure
        working-directory: formatter
        run: |
          set -euo pipefail
          out="$(nix build .#verihogg-format --no-link --print-out-paths)"
          test -x "$out/bin/verihogg-format"
          mkdir -p "$GITHUB_WORKSPACE/closure"
          printf '%s\n' "$out" > "$GITHUB_WORKSPACE/closure/formatter-root.txt"
          mapfile -t closure < <(nix-store -qR "$out")
          test "${#closure[@]}" -gt 0
          nix-store --export "${closure[@]}" \
            | zstd -3 -T0 -c > "$GITHUB_WORKSPACE/closure/formatter.closure.zst"
          ls -lh "$GITHUB_WORKSPACE/closure"

      - name: Upload formatter closure
        uses: actions/upload-artifact@v7
        with:
          name: formatter-closure
          path: closure/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  report:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: black-parrot
            repository: black-parrot/black-parrot
            ref: master
          - name: cheriot-ibex-dv
            repository: lowRISC/cheriot-ibex-dv
            ref: main
          - name: cheriot-ibex-rtl
            repository: microsoft/cheriot-ibex
            ref: 14e275b4d36486c9979a76248791c410145ea50b
          - name: core-v-verif
            repository: openhwfoundation/core-v-verif
            ref: master
          - name: cva6
            repository: openhwfoundation/cva6
            ref: main
          - name: cva6-cvfpu
            repository: openhwfoundation/cvfpu
            ref: 3eb6afeab2cb33f7d8689222955d0171aeb3a801
          - name: cva6-hpdcache
            repository: openhwfoundation/cv-hpdcache
            ref: 40d2897eda70644df2eb857efd9fa573eaacafab
          - name: ibex
            repository: lowRISC/ibex
            ref: master
          - name: opentitan
            repository: lowRISC/opentitan
            ref: master
          - name: scr1
            repository: syntacore/scr1
            ref: master
          - name: uvm-core
            repository: accellera-official/uvm-core
            ref: main

    steps:
      - name: Checkout report tools
        uses: actions/checkout@v6
        with:
          path: formatter
          sparse-checkout: tools

      - name: Install Nix (for closure import only)
        uses: cachix/install-nix-action@v31

      - name: Download formatter closure
        uses: actions/download-artifact@v8
        with:
          name: formatter-closure
          path: formatter-closure

      - name: Import formatter
        run: |
          set -euo pipefail
          test -s formatter-closure/formatter-root.txt
          test -s formatter-closure/formatter.closure.zst
          zstd -dc formatter-closure/formatter.closure.zst \
            | nix-store --import > /dev/null
          root="$(cat formatter-closure/formatter-root.txt)"
          test -x "$root/bin/verihogg-format"
          echo "FORMATTER=$root/bin/verihogg-format" >> "$GITHUB_ENV"

      - name: Checkout ${{ matrix.project.name }}
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.project.repository }}
          ref: ${{ matrix.project.ref }}
          path: src/${{ matrix.project.name }}

      - name: Generate ${{ matrix.project.name }} report
        run: |
          set -euo pipefail
          python3 formatter/tools/unsupported-report/unsupported_report.py \
            "src/${{ matrix.project.name }}" \
            --formatter "$FORMATTER" \
            -o "out/projects/unsupported-${{ matrix.project.name }}.html"

      - name: Upload project report
        uses: actions/upload-artifact@v7
        with:
          name: unsupported-project-${{ matrix.project.name }}
          path: out/projects/unsupported-${{ matrix.project.name }}.html
          if-no-files-found: error
          retention-days: 7

      - name: Upload partial output on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unsupported-project-failure-${{ matrix.project.name }}
          path: out/
          if-no-files-found: ignore
          retention-days: 7

  index:
    needs: report
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout report tools
        uses: actions/checkout@v6
        with:
          path: formatter
          sparse-checkout: tools

      - name: Download project reports
        uses: actions/download-artifact@v8
        with:
          pattern: unsupported-project-*
          path: out/projects
          merge-multiple: true

      - name: Build index
        run: |
          set -euo pipefail
          python3 formatter/tools/unsupported-report/build_index.py \
            --projects-dir out/projects \
            -o out/index.html

      - name: Verify output
        run: |
          set -euo pipefail
          find out -maxdepth 3 -type f -print
          test -s out/index.html
          for project in \
            black-parrot cheriot-ibex-dv cheriot-ibex-rtl \
            core-v-verif cva6 cva6-cvfpu cva6-hpdcache \
            ibex opentitan scr1 uvm-core; do
            test -s "out/projects/unsupported-${project}.html"
          done
          grep -q '<code>automatic</code> <span class="muted">AutomaticKeyword</span>' out/index.html
          if grep -q '<code>automatic AutomaticKeyword</code>' out/index.html; then
            echo "Unexpected merged token format in index.html" >&2
            exit 1
          fi
          if grep -RIn '/nix/store' out; then
            echo "Nix store path leaked into reports" >&2
            exit 1
          fi

      - name: Upload combined report
        uses: actions/upload-artifact@v7
        with:
          name: unsupported-report-test
          path: out/
          if-no-files-found: error
          retention-days: 7

      - name: Package Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out/

  deploy:
    needs: index
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
